<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <circle cx="256" cy="256" r="160" fill="#fff" filter="url(#shadow)"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="#1e293b" stroke-width="6"/>

  <g fill="#1e293b">
    <rect x="252" y="104" width="8" height="22" rx="2"/>
    <rect x="252" y="386" width="8" height="22" rx="2"/>
    <rect x="386" y="252" width="22" height="8" rx="2"/>
    <rect x="104" y="252" width="22" height="8" rx="2"/>
  </g>

  <line x1="256" y1="256" x2="256" y2="160" stroke="#1e293b" stroke-width="10" stroke-linecap="round"/>
  <line x1="256" y1="256" x2="328" y2="256" stroke="#3b82f6" stroke-width="8" stroke-linecap="round"/>
  <circle cx="256" cy="256" r="12" fill="#1e293b"/>

  <circle cx="380" cy="380" r="56" fill="#10b981" stroke="#fff" stroke-width="8"/>
  <path d="M 358 380 L 376 396 L 404 366" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
